<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="919" height="379" rx="20" fill="#15151b" stroke="rgba(255,255,255,0.06)"></rect>

  <text x="48" y="58" font-size="12" font-weight="600" letter-spacing="2.2" fill="#6b6b78">TWO DIRECTIONS</text>
  <text x="48" y="88" font-size="22" font-weight="700" fill="#f2f2f5">Pull about thirty times. Push exactly five.</text>

  <rect x="48.5" y="120.5" width="289" height="149" rx="14" fill="#1c1c24" stroke="rgba(255,255,255,0.07)"></rect>
  <text x="70" y="148" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#6b6b78">WEBVIEW PROCESS</text>
  <text x="70" y="178" font-size="17" font-weight="700" fill="#f2f2f5">React</text>
  <text x="70" y="202" font-size="13" fill="#c9c9d4">hooks · shared store</text>
  <text x="70" y="224" font-size="13" fill="#7c7c8a">no OS access at all</text>

  <rect x="582.5" y="120.5" width="289" height="149" rx="14" fill="#1c1c24" stroke="rgba(255,255,255,0.07)"></rect>
  <text x="604" y="148" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#6b6b78">NATIVE PROCESS</text>
  <text x="604" y="178" font-size="17" font-weight="700" fill="#f2f2f5">Rust</text>
  <text x="604" y="202" font-size="13" fill="#c9c9d4">commands · monitors</text>
  <text x="604" y="224" font-size="13" fill="#7c7c8a">full OS access</text>

  <text x="460" y="148" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#818cf8" text-anchor="middle">PULL · ~30 COMMANDS</text>
  <line x1="346" y1="172" x2="566" y2="172" stroke="#818cf8" stroke-width="2"></line>
  <polygon points="566,167 574,172 566,177" fill="#818cf8"></polygon>
  <rect x="390.5" y="160.5" width="139" height="23" rx="12" fill="#1c1c2b" stroke="rgba(129,140,248,0.5)"></rect>
  <text x="460" y="176" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#a5b4fc" text-anchor="middle">invoke(cmd, args)</text>

  <line x1="574" y1="206" x2="354" y2="206" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 4"></line>
  <polygon points="354,201 346,206 354,211" fill="#818cf8"></polygon>
  <rect x="411.5" y="194.5" width="97" height="23" rx="12" fill="#1c1c2b" stroke="rgba(129,140,248,0.35)"></rect>
  <text x="460" y="210" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#a5b4fc" text-anchor="middle">JSON result</text>

  <text x="460" y="242" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#c4b5fd" text-anchor="middle">PUSH · 5 EVENTS</text>
  <line x1="574" y1="264" x2="354" y2="264" stroke="#c4b5fd" stroke-width="2"></line>
  <polygon points="354,259 346,264 354,269" fill="#c4b5fd"></polygon>
  <rect x="413.5" y="252.5" width="93" height="23" rx="12" fill="#241c2b" stroke="rgba(196,181,253,0.5)"></rect>
  <text x="460" y="268" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#c4b5fd" text-anchor="middle">emit(event)</text>

  <rect x="153.5" y="306.5" width="107" height="21" rx="11" fill="#14141c" stroke="rgba(255,255,255,0.1)"></rect>
  <text x="207" y="321" font-family="Menlo, Consolas, monospace" font-size="11" fill="#9a9aa8" text-anchor="middle">live-throughput</text>
  <rect x="268.5" y="306.5" width="135" height="21" rx="11" fill="#14141c" stroke="rgba(255,255,255,0.1)"></rect>
  <text x="336" y="321" font-family="Menlo, Consolas, monospace" font-size="11" fill="#9a9aa8" text-anchor="middle">speed-test-progress</text>
  <rect x="411.5" y="306.5" width="109" height="21" rx="11" fill="#14141c" stroke="rgba(255,255,255,0.1)"></rect>
  <text x="466" y="321" font-family="Menlo, Consolas, monospace" font-size="11" fill="#9a9aa8" text-anchor="middle">network-changed</text>
  <rect x="528.5" y="306.5" width="109" height="21" rx="11" fill="#14141c" stroke="rgba(255,255,255,0.1)"></rect>
  <text x="583" y="321" font-family="Menlo, Consolas, monospace" font-size="11" fill="#9a9aa8" text-anchor="middle">internet-status</text>
  <rect x="645.5" y="306.5" width="121" height="21" rx="11" fill="#14141c" stroke="rgba(255,255,255,0.1)"></rect>
  <text x="706" y="321" font-family="Menlo, Consolas, monospace" font-size="11" fill="#9a9aa8" text-anchor="middle">services-timeline</text>

  <text x="460" y="356" font-size="12.5" fill="#7c7c8a" text-anchor="middle">continuous, mid-operation, or triggered from outside — nothing else qualifies</text>
</svg>
