<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="919" height="379" rx="20" fill="#15151b" stroke="rgba(255,255,255,0.06)"></rect>

  <text x="48" y="58" font-size="12" font-weight="600" letter-spacing="2.2" fill="#6b6b78">ONE INVOKE, ON THE WIRE</text>
  <text x="48" y="88" font-size="22" font-weight="700" fill="#f2f2f5">HTTP-shaped, but never on the network</text>

  <rect x="48.5" y="116.5" width="469" height="117" rx="14" fill="#1c1c24" stroke="rgba(129,140,248,0.45)"></rect>
  <text x="70" y="140" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#818cf8">REQUEST</text>
  <text x="70" y="168" font-family="Menlo, Consolas, monospace" font-size="12" fill="#f2f2f5">POST  ipc://localhost/get_network_info</text>
  <text x="70" y="194" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9a9aa8">Tauri-Invoke-Key: …</text>
  <text x="70" y="220" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9a9aa8">{ "host": "1.1.1.1" }</text>

  <line x1="522" y1="164" x2="544" y2="164" stroke="#55556a" stroke-width="1.5"></line>
  <polygon points="544,160 551,164 544,168" fill="#55556a"></polygon>
  <text x="558" y="168" font-size="12.5" fill="#c9c9d4">command name is the URL path</text>

  <line x1="522" y1="190" x2="544" y2="190" stroke="#55556a" stroke-width="1.5"></line>
  <polygon points="544,186 551,190 544,194" fill="#55556a"></polygon>
  <text x="558" y="194" font-size="12.5" fill="#c9c9d4">proves the call came from your app</text>

  <line x1="522" y1="216" x2="544" y2="216" stroke="#55556a" stroke-width="1.5"></line>
  <polygon points="544,212 551,216 544,220" fill="#55556a"></polygon>
  <text x="558" y="220" font-size="12.5" fill="#c9c9d4">arguments, matched to Rust params</text>

  <rect x="48.5" y="256.5" width="469" height="91" rx="14" fill="#1c1c24" stroke="rgba(196,181,253,0.45)"></rect>
  <text x="70" y="280" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#c4b5fd">RESPONSE</text>
  <text x="70" y="308" font-family="Menlo, Consolas, monospace" font-size="12" fill="#f2f2f5">Tauri-Response: ok</text>
  <text x="70" y="334" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9a9aa8">application/json  { "connectionType": … }</text>

  <line x1="522" y1="304" x2="544" y2="304" stroke="#55556a" stroke-width="1.5"></line>
  <polygon points="544,300 551,304 544,308" fill="#55556a"></polygon>
  <text x="558" y="308" font-size="12.5" fill="#c9c9d4">ok | error → resolve or reject</text>

  <line x1="522" y1="330" x2="544" y2="330" stroke="#55556a" stroke-width="1.5"></line>
  <polygon points="544,326 551,330 544,334" fill="#55556a"></polygon>
  <text x="558" y="334" font-size="12.5" fill="#c9c9d4">serde renamed it to camelCase</text>
</svg>
