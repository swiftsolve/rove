name: publish-tokens

# On each tokens release tag (tokens-v*, written by the package's `release`
# script), check the tokens, then publish packages/tokens to npm
# (https://www.npmjs.com/package/@swiftsolve/rove-tokens) only if the check
# passes, so a build error or a contrast failure never reaches the sites that
# install it. Run it on demand from Actions to check master between releases:
# it publishes only from a tag. The tags have their own prefix because
# release.yml builds the app on v* tags.
#
# It signs in with npm trusted publishing, so the repo holds no npm token: on
# npmjs.com the package's Settings name this repository and publish-tokens.yml
# as a trusted publisher, so keep this file's name. pnpm exchanges the job's
# OIDC token for a publish token and attaches a provenance statement to each
# version. No registry-url here: the token setup-node would write in its
# place is empty, and publishConfig already names the registry.
on:
  push:
    tags: ['tokens-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # pnpm at the version package.json's packageManager names.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build, the typecheck of the scripts, and the package's tests: the
      # plugin test and the contrast and DESIGN.md format checks. ESLint and
      # Prettier cover it in test.yml, on every push to master.
      - run: pnpm turbo run build typecheck test --filter=@swiftsolve/rove-tokens

      # The build rewrites DESIGN.md's front matter, so the committed one must
      # match it.
      - name: DESIGN.md is up to date
        run: git diff --exit-code -- packages/tokens/DESIGN.md

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/tokens-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@v5

      # pnpm at the version package.json's packageManager names.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check the tag matches package.json
        run: test "tokens-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # The install builds the tokens through `prepare`, and pnpm publish builds
      # them again before packing, so the package ships dist/. A tag checks out
      # no branch, so pnpm's branch check is skipped.
      - run: pnpm install --frozen-lockfile

      - run: pnpm publish --no-git-checks
