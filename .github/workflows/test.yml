name: test

# The UI's checks: typecheck, lint, and every test, the stories included (each
# renders in headless Chromium, runs its play function and the a11y checks),
# then the service layer's Rust format, lints and tests. One Linux runner on
# each push; build.yml runs the Rust on all three OSes and builds the app, for
# a release tag or on demand, since macOS and Windows minutes cost 10x and 2x.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # A persisted GITHUB_TOKEN header would override the design-tokens
          # token below for every github.com request git makes in the repo.
          persist-credentials: false

      # pnpm at the version package.json's packageManager names.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The story tests' browser.
      - run: pnpm exec playwright install --with-deps chromium

      # turbo's results (typecheck, ESLint, tests) and Prettier's, saved under
      # each commit and restored from the latest, so a run redoes only the
      # tasks whose files changed. Both key on file contents, never mtimes.
      - uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            node_modules/.cache/prettier
          key: check-${{ runner.os }}-${{ github.sha }}
          restore-keys: check-${{ runner.os }}-

      # FIGMA_TOKEN lets checks/figma-export.ts hold the library to the Figma
      # file; it skips while the secret isn't set.
      - run: pnpm check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      # The tokens' build rewrites DESIGN.md's front matter, so the committed
      # one must match it.
      - name: Tokens' DESIGN.md is up to date
        run: git diff --exit-code -- packages/tokens/DESIGN.md

      # Linux only here; each platform's cfg-gated code is linted and tested on
      # its own OS by build.yml. Lints: Cargo.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Lint service layer
        run: cargo clippy -p rove-core --all-targets -- -D warnings

      - name: Test service layer
        run: cargo test -p rove-core
