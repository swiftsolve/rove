name: test

# The UI's checks: typecheck, lint, and every test, the stories included (each
# renders in headless Chromium, runs its play function and the a11y checks),
# then the service layer's Rust format, lints and tests. One Linux runner on
# each push; build.yml runs the Rust on all three OSes and builds the app, for
# a release tag or by hand, since macOS and Windows minutes cost 10x and 2x.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # A persisted GITHUB_TOKEN header would override the design-tokens
          # token below for every github.com request git makes in the repo.
          persist-credentials: false
          # The catalogue check compares the UI library's API with the commit
          # the push or pull request starts from, so it needs that history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The story tests' browser.
      - run: npx playwright install --with-deps chromium

      # FIGMA_TOKEN lets checks/figma.mjs hold the library to the Figma file; it
      # skips while the secret isn't set. UI_API_BASE is what the catalogue
      # check compares the library's API with: a pull request's base, or the
      # commit before the push.
      - run: npm run check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          UI_API_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # Linux only here; each platform's cfg-gated code is linted and tested on
      # its own OS by build.yml. Lints: Cargo.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Lint service layer
        run: cargo clippy -p rove-core --all-targets -- -D warnings

      - name: Test service layer
        run: cargo test -p rove-core
